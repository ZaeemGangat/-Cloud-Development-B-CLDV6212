# ---------------------------------------------------------------------------
# CoffeeNChill - LOCAL development stack. Builds the images from source.
#
#   docker compose -f docker-compose.local.yml up --build
#
#   Gateway + Swagger:  http://localhost:5000/swagger
#   Functions host:     http://localhost:7071/api/menu
#   Azurite:            10000 (blob) / 10001 (queue) / 10002 (table)
#                       - connect Azure Storage Explorer to "Local emulator"
# Seed Admin: manager@coffeenchill.ac.za / Manager#2026!
# ---------------------------------------------------------------------------
name: coffeenchill-local

x-storage-connection: &storage-connection
  "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: >
      azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
      --location /data --skipApiVersionCheck --loose
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data-local:/data

  functions:
    build: ./CoffeeNChill.Functions
    image: coffeenchill-functions:local
    ports:
      - "7071:80"
    environment:
      AzureWebJobsStorage: *storage-connection
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      OrderProcessing__StepDelaySeconds: "5"
    depends_on:
      - azurite

  gateway:
    build: ./CoffeeNChill.Gateway
    image: coffeenchill-gateway:local
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Storage__ConnectionString: *storage-connection
      Jwt__Key: local-dev-only-key-change-me-0123456789-abcdefghijklmnop
      SeedAdmin__Email: manager@coffeenchill.ac.za
      SeedAdmin__Password: "Manager#2026!"
    depends_on:
      - azurite
      - functions

volumes:
  azurite-data-local:
